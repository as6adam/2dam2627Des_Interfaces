# Comprobaciones en cada push/PR. El despliegue de dist/ a GitHub Pages SOLO se hace a mano
# (Actions → «CI y Pages» → Run workflow → marcar «deploy»).
#
# AVISO: en el repositorio 2dam2627Des_Interfaces, Pages ya publica «Tempora».
# Un repositorio tiene un único sitio de Pages: desplegar Brum desde aquí lo sustituiría.
# Una web de GitHub Pages es pública.
name: CI y Pages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Desplegar dist/ en GitHub Pages (sustituye el sitio actual del repositorio)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      # Versión visible en el pie y usada por el aviso de actualización.
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - name: Instalar dependencias (package-lock.json)
        run: npm ci

      - name: Tipos y validación del catálogo
        run: npm run typecheck

      # Las pruebas usan el Chrome preinstalado en el runner (playwright-core, channel "chrome").
      - name: Build con base de prueba /brum-guide/
        run: npm run build:pages
      - name: Prueba de humo
        run: npm run test:e2e
      - name: Prueba de movimiento
        run: npm run test:motion
      - name: Prueba PWA (worker, sin conexión, actualización)
        run: npm run test:pwa

      - name: Build definitivo con la base del repositorio (/<repo>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configurar Pages
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/configure-pages@v5

      - name: Subir dist/
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
